<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>TeleCal</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  {{ANALYTICS}}
  <style>
    :root {
      --bg-color: var(--tg-theme-bg-color, #ffffff);
      --text-color: var(--tg-theme-text-color, #000000);
      --hint-color: var(--tg-theme-hint-color, #999999);
      --link-color: var(--tg-theme-link-color, #2481cc);
      --button-color: var(--tg-theme-button-color, #2481cc);
      --button-text: var(--tg-theme-button-text-color, #ffffff);
      --secondary-bg: var(--tg-theme-secondary-bg-color, #f0f0f0);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      padding-bottom: 20px;
    }

    .tabs {
      display: flex;
      background: var(--secondary-bg);
      padding: 8px;
      gap: 8px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .tab {
      flex: 1;
      padding: 10px 16px;
      border: none;
      background: transparent;
      color: var(--hint-color);
      font-size: 14px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab.active {
      background: var(--button-color);
      color: var(--button-text);
    }

    .view {
      display: none;
      padding: 16px;
    }

    .view.active {
      display: block;
    }

    /* Progress Ring */
    .progress-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 0;
    }

    .progress-ring {
      position: relative;
      width: 200px;
      height: 200px;
    }

    .progress-ring canvas {
      width: 100%;
      height: 100%;
    }

    .progress-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
    }

    .progress-calories {
      font-size: 32px;
      font-weight: 700;
    }

    .progress-goal {
      font-size: 14px;
      color: var(--hint-color);
    }

    .progress-percent {
      font-size: 16px;
      color: var(--link-color);
      margin-top: 4px;
    }

    /* Protein bar under the ring */
    .protein-wrap {
      width: 100%;
      max-width: 280px;
      margin: 0 auto 8px;
    }

    .protein-text {
      font-size: 14px;
      color: var(--hint-color);
      text-align: center;
      margin-bottom: 6px;
    }

    .protein-text strong {
      color: var(--text-color);
    }

    .protein-bar {
      height: 8px;
      border-radius: 4px;
      background: var(--secondary-bg);
      overflow: hidden;
    }

    .protein-bar.hidden {
      display: none;
    }

    .protein-bar-fill {
      height: 100%;
      width: 0;
      border-radius: 4px;
      background: var(--link-color);
      transition: width 0.3s;
    }

    .protein-wrap.hidden,
    .macros-text.hidden,
    .segmented.hidden {
      display: none;
    }

    /* The other tracked macros, one line under the protein bar */
    .macros-text {
      font-size: 14px;
      color: var(--hint-color);
      text-align: center;
      max-width: 280px;
      margin: 0 auto 8px;
    }

    /* Calories | each tracked macro */
    .segmented {
      display: flex;
      background: var(--secondary-bg);
      border-radius: 8px;
      padding: 4px;
      gap: 4px;
      margin-bottom: 12px;
    }

    /* min-width: 0 lets the buttons shrink on a narrow screen instead of widening the page */
    .segmented button {
      flex: 1;
      min-width: 0;
      padding: 6px 4px;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: var(--hint-color);
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
    }

    .segmented button.active {
      background: var(--bg-color);
      color: var(--text-color);
    }

    /* Chart containers */
    .chart-container {
      position: relative;
      height: 200px;
      margin-bottom: 16px;
    }

    /* Calendar */
    .calendar {
      margin-top: 16px;
    }

    .calendar-header {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      margin-bottom: 8px;
    }

    .calendar-header span {
      text-align: center;
      font-size: 12px;
      color: var(--hint-color);
      font-weight: 600;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }

    .calendar-day {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      border-radius: 50%;
      cursor: pointer;
      transition: all 0.2s;
      border: none;
      background: transparent;
      color: var(--text-color);
    }

    .calendar-day:hover {
      background: var(--secondary-bg);
    }

    .calendar-day.empty {
      color: var(--hint-color);
      cursor: default;
    }

    .calendar-day.has-data {
      font-weight: 600;
    }

    .calendar-day.selected {
      background: var(--button-color);
      color: var(--button-text);
    }

    .calendar-day.no-data {
      color: var(--hint-color);
    }

    /* Food log */
    .food-log {
      margin-top: 16px;
    }

    .food-log-header {
      font-size: 14px;
      font-weight: 600;
      color: var(--hint-color);
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--secondary-bg);
    }

    .food-item {
      display: flex;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--secondary-bg);
    }

    .food-item:last-child {
      border-bottom: none;
    }

    .food-emoji {
      font-size: 24px;
      margin-right: 12px;
      width: 32px;
      text-align: center;
    }

    .food-details {
      flex: 1;
    }

    .food-name {
      font-size: 15px;
      margin-bottom: 2px;
    }

    .food-macros {
      font-size: 13px;
      color: var(--hint-color);
    }

    .food-calories {
      font-size: 15px;
      font-weight: 600;
      color: var(--link-color);
      white-space: nowrap;
      margin-left: 12px;
    }

    .empty-state {
      text-align: center;
      padding: 32px;
      color: var(--hint-color);
    }

    .empty-state-icon {
      font-size: 48px;
      margin-bottom: 12px;
    }

    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 48px;
      color: var(--hint-color);
    }

    .section-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--hint-color);
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Foods tab */
    .tab.hidden,
    .foods-select.hidden,
    .foods-delete-bar.hidden,
    .food-form-error.hidden {
      display: none;
    }

    .foods-search {
      width: 100%;
      padding: 10px 12px;
      border: none;
      border-radius: 10px;
      background: var(--secondary-bg);
      color: var(--text-color);
      font-size: 15px;
      margin-bottom: 8px;
    }

    .foods-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }

    .foods-count {
      font-size: 13px;
      color: var(--hint-color);
    }

    .foods-select {
      border: none;
      background: none;
      color: var(--link-color);
      font-size: 15px;
      cursor: pointer;
    }

    .food-row {
      cursor: pointer;
    }

    .food-check {
      width: 18px;
      height: 18px;
      margin-right: 12px;
      pointer-events: none;
    }

    .foods-delete-bar {
      position: sticky;
      bottom: 0;
      padding: 12px 0;
      background: var(--bg-color);
    }

    .foods-button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: var(--button-color);
      color: var(--button-text);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .foods-button.danger {
      background: transparent;
      color: var(--tg-theme-destructive-text-color, #e53935);
      border: 1px solid currentColor;
    }

    .foods-button:disabled {
      opacity: 0.5;
    }

    .food-form label {
      display: block;
      font-size: 13px;
      color: var(--hint-color);
      margin-bottom: 12px;
    }

    .food-form input,
    .food-form select {
      display: block;
      width: 100%;
      margin-top: 4px;
      padding: 10px 12px;
      border: none;
      border-radius: 10px;
      background: var(--secondary-bg);
      color: var(--text-color);
      font-size: 15px;
    }

    .food-form-row {
      display: flex;
      gap: 12px;
    }

    .food-form-row label {
      flex: 1;
    }

    .food-form-error {
      color: var(--tg-theme-destructive-text-color, #e53935);
      font-size: 14px;
      margin-bottom: 12px;
    }

    .food-form-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
  </style>
</head>
<body>
  <div class="tabs">
    <button class="tab active" data-tab="today">Today</button>
    <button class="tab" data-tab="week">Week</button>
    <button class="tab" data-tab="month">Month</button>
    <button class="tab hidden" data-tab="foods" id="foods-tab">Foods</button>
  </div>

  <div id="today-view" class="view active">
    <div class="progress-container">
      <div class="progress-ring">
        <canvas id="progress-chart"></canvas>
        <div class="progress-text">
          <div class="progress-calories" id="today-calories">--</div>
          <div class="progress-goal" id="today-goal">/ -- cal</div>
          <div class="progress-percent" id="today-percent">--%</div>
        </div>
      </div>
    </div>
    <div class="protein-wrap" id="today-protein-wrap">
      <div class="protein-text" id="today-protein">--</div>
      <div class="protein-bar" id="today-protein-bar"><div class="protein-bar-fill" id="today-protein-fill"></div></div>
    </div>
    <div class="macros-text hidden" id="today-macros"></div>
    <div class="food-log" id="today-log"></div>
  </div>

  <div id="week-view" class="view">
    <div class="segmented hidden" data-view="week"></div>
    <div class="chart-container">
      <canvas id="week-chart"></canvas>
    </div>
    <div class="food-log" id="week-log"></div>
  </div>

  <div id="month-view" class="view">
    <div class="section-title">30-Day Trend</div>
    <div class="segmented hidden" data-view="month"></div>
    <div class="chart-container">
      <canvas id="month-chart"></canvas>
    </div>
    <div class="calendar" id="calendar"></div>
    <div class="food-log" id="month-log"></div>
  </div>

  <div id="foods-view" class="view">
    <input id="foods-search" class="foods-search" type="search" placeholder="Search foods" autocomplete="off">
    <div class="foods-toolbar">
      <span id="foods-count" class="foods-count"></span>
      <button id="foods-select" class="foods-select hidden" type="button">Select</button>
    </div>
    <div id="foods-list" class="food-log"></div>
    <div id="foods-delete-bar" class="foods-delete-bar hidden">
      <button id="foods-delete" class="foods-button danger" type="button">Delete 0</button>
    </div>
  </div>

  <div id="food-edit-view" class="view">
    <form id="food-form" class="food-form" novalidate>
      <label>Name<input name="name" type="text" maxlength="100"></label>
      <label>Serving<input name="serving" type="text" maxlength="100" placeholder="1/2 cup (40 g)"></label>
      <div class="food-form-row">
        <label>Amount<input name="serving_amount" type="number" min="0" step="any" inputmode="decimal"></label>
        <label>Unit<select name="serving_unit"><option value="">none</option><option value="g">g</option><option value="ml">ml</option></select></label>
      </div>
      <label>Calories<input name="calories" type="number" min="0" max="5000" step="1" inputmode="numeric"></label>
      <div id="food-form-macros"></div>
      <div id="food-form-error" class="food-form-error hidden"></div>
      <div class="food-form-actions">
        <button type="submit" class="foods-button">Save</button>
        <button type="button" id="food-form-delete" class="foods-button danger">Delete</button>
      </div>
    </form>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    // State
    let userData = null;
    let weekData = null;
    let monthData = null;
    let selectedDate = null;
    let charts = {};

    // Which series the week/month charts show. Shared by both views on purpose.
    let metric = 'calories';

    // Every macro /api/user can list in tracked_macros, in the registry's
    // order (src/macros.ts; app-page.test.ts checks each key is here).
    const MACRO_LABELS = {
      protein: { column: 'protein_g', toggle: 'Protein', item: '', total: 'protein', form: 'Protein' },
      fat: { column: 'fat_g', toggle: 'Fat', item: 'fat', total: 'fat', form: 'Fat' },
      fiber: { column: 'fiber_g', toggle: 'Fiber', item: 'fiber', total: 'fiber', form: 'Fiber' },
      added_sugar: { column: 'added_sugar_g', toggle: 'Sugar', item: 'sugar', total: 'added sugar', form: 'Added sugar' },
    };

    // The user's macros. A server that predates tracked_macros only knew protein.
    function trackedMacros() {
      const keys = (userData && userData.tracked_macros) || ['protein'];
      return keys.filter(key => key in MACRO_LABELS);
    }

    // `14 g`, `24 g fat`, `? g sugar`.
    function gramsText(value, label) {
      const grams = value === null || value === undefined ? '? g' : `${value} g`;
      return label ? `${grams} ${label}` : grams;
    }

    function metricSeries(data, key) {
      if (key === 'calories') return data.daily;
      if (data.dailyMacros && data.dailyMacros[key]) return data.dailyMacros[key];
      return key === 'protein' ? data.dailyProtein || {} : {};
    }

    // Only calories and protein have goals.
    function metricGoal(user, key) {
      if (key === 'calories') return user && user.daily_goal;
      if (key === 'protein') return user && user.daily_protein_goal;
      return null;
    }

    // PostHog, when the server injected it (window.telecalAnalytics) and
    // /api/user returned an analytics_id. Either can be missing: a server
    // without a key, or an older server without the field.
    function startAnalytics(user) {
      if (window.telecalAnalytics && user.analytics_id) window.telecalAnalytics.start(user.analytics_id);
    }

    // Names and views only, never food text.
    function track(event, properties) {
      if (window.telecalAnalytics) window.telecalAnalytics.track(event, properties);
    }

    async function getUser() {
      const user = await api('/api/user');
      startAnalytics(user);
      return user;
    }

    // Shared across every caller, so /api/user is requested once and
    // startAnalytics runs once. A failed request clears the cache so a later
    // call can retry.
    let userPromise = null;
    function loadUser() {
      if (!userPromise) userPromise = getUser().catch(e => { userPromise = null; throw e; });
      return userPromise;
    }

    // API helpers
    async function api(endpoint) {
      const res = await fetch(endpoint, {
        headers: { 'Authorization': `tg-init-data ${tg.initData}` }
      });
      if (!res.ok) throw new Error('API error');
      return res.json();
    }

    // Format date for display
    function formatDate(dateStr) {
      const date = new Date(dateStr + 'T00:00:00');
      return date.toLocaleDateString('en-US', {
        weekday: 'long',
        month: 'short',
        day: 'numeric'
      });
    }

    // Get day of week abbreviation
    function getDayAbbr(dateStr) {
      const date = new Date(dateStr + 'T00:00:00');
      return date.toLocaleDateString('en-US', { weekday: 'short' });
    }

    // Render food items (using DOM APIs to prevent XSS)
    function renderFoodLog(container, items, date) {
      container.innerHTML = ''; // Clear container safely

      if (!items || items.length === 0) {
        const emptyDiv = document.createElement('div');
        emptyDiv.className = 'empty-state';

        const iconDiv = document.createElement('div');
        iconDiv.className = 'empty-state-icon';
        iconDiv.textContent = '🍽️';

        const textDiv = document.createElement('div');
        textDiv.textContent = 'No food logged' + (date ? ' for ' + formatDate(date) : '');

        emptyDiv.appendChild(iconDiv);
        emptyDiv.appendChild(textDiv);
        container.appendChild(emptyDiv);
        return;
      }

      const tracked = trackedMacros();
      const extras = tracked.filter(key => key !== 'protein');
      const headerText = date ? formatDate(date) : "Today's Log";
      const total = items.reduce((sum, item) => sum + item.calories, 0);
      const sumOf = key => items.reduce((sum, item) => {
        const value = item[MACRO_LABELS[key].column];
        return sum + (typeof value === 'number' ? value : 0);
      }, 0);

      const headerDiv = document.createElement('div');
      headerDiv.className = 'food-log-header';
      const parts = [`${total} cal`, ...tracked.map(key => `${sumOf(key)} g ${MACRO_LABELS[key].total}`)];
      headerDiv.textContent = `${headerText} • ${parts.join(' · ')}`;
      container.appendChild(headerDiv);

      items.forEach(item => {
        const itemDiv = document.createElement('div');
        itemDiv.className = 'food-item';

        const emojiDiv = document.createElement('div');
        emojiDiv.className = 'food-emoji';
        emojiDiv.textContent = item.emoji || '🍴';

        const detailsDiv = document.createElement('div');
        detailsDiv.className = 'food-details';

        const nameDiv = document.createElement('div');
        nameDiv.className = 'food-name';
        nameDiv.textContent = item.description; // Safe: textContent escapes HTML

        detailsDiv.appendChild(nameDiv);

        // Tracked macros other than protein go on a second line under the name.
        if (extras.length > 0) {
          const macrosDiv = document.createElement('div');
          macrosDiv.className = 'food-macros';
          macrosDiv.textContent = extras.map(key => gramsText(item[MACRO_LABELS[key].column], MACRO_LABELS[key].item)).join(' · ');
          detailsDiv.appendChild(macrosDiv);
        }

        const caloriesDiv = document.createElement('div');
        caloriesDiv.className = 'food-calories';
        caloriesDiv.textContent = tracked.includes('protein')
          ? `${item.calories} cal · ${gramsText(item.protein_g, '')}`
          : `${item.calories} cal`;

        itemDiv.appendChild(emojiDiv);
        itemDiv.appendChild(detailsDiv);
        itemDiv.appendChild(caloriesDiv);
        container.appendChild(itemDiv);
      });
    }

    // Initialize progress ring chart
    function createProgressChart(current, goal) {
      const ctx = document.getElementById('progress-chart').getContext('2d');
      const percent = goal > 0 ? Math.min(current / goal, 1) : 0;

      if (charts.progress) charts.progress.destroy();

      charts.progress = new Chart(ctx, {
        type: 'doughnut',
        data: {
          datasets: [{
            data: [percent, 1 - percent],
            backgroundColor: [
              getComputedStyle(document.documentElement).getPropertyValue('--button-color').trim() || '#2481cc',
              getComputedStyle(document.documentElement).getPropertyValue('--secondary-bg').trim() || '#f0f0f0'
            ],
            borderWidth: 0
          }]
        },
        options: {
          cutout: '75%',
          responsive: true,
          maintainAspectRatio: true,
          plugins: { legend: { display: false }, tooltip: { enabled: false } }
        }
      });

      document.getElementById('today-calories').textContent = current.toLocaleString();
      document.getElementById('today-goal').textContent = goal ? `/ ${goal.toLocaleString()} cal` : 'No goal set';
      document.getElementById('today-percent').textContent = goal ? `${Math.round(percent * 100)}%` : '';
    }

    // Protein under the ring: a slim bar when a goal is set, text alone when not.
    function renderProteinBar(current, goal) {
      const text = document.getElementById('today-protein');
      const bar = document.getElementById('today-protein-bar');
      const fill = document.getElementById('today-protein-fill');

      text.innerHTML = '';
      const strong = document.createElement('strong');
      strong.textContent = current.toLocaleString();
      text.appendChild(strong);

      if (goal) {
        text.appendChild(document.createTextNode(` / ${goal.toLocaleString()} g protein`));
        bar.classList.remove('hidden');
        fill.style.width = `${Math.round(Math.min(current / goal, 1) * 100)}%`;
      } else {
        text.appendChild(document.createTextNode(' g protein'));
        bar.classList.add('hidden');
      }
    }

    // Under the ring: the protein bar when protein is tracked, then one line
    // for any other tracked macros.
    function renderMacros(today, user) {
      const tracked = trackedMacros();
      const showProtein = tracked.includes('protein');
      document.getElementById('today-protein-wrap').classList.toggle('hidden', !showProtein);
      if (showProtein) renderProteinBar(today.protein || 0, user.daily_protein_goal);

      const totals = today.macros || {};
      const extras = tracked.filter(key => key !== 'protein');
      const line = document.getElementById('today-macros');
      line.textContent = extras.map(key => `${(totals[key] || 0).toLocaleString()} g ${MACRO_LABELS[key].total}`).join(' · ');
      line.classList.toggle('hidden', extras.length === 0);
    }

    // Initialize week bar chart
    function createWeekChart(data, user, metric) {
      const ctx = document.getElementById('week-chart').getContext('2d');
      const series = metricSeries(data, metric);
      const goal = metricGoal(user, metric);
      const dates = Object.keys(data.daily).sort();
      const values = dates.map(d => series[d] || 0);
      const labels = dates.map(d => getDayAbbr(d));

      const buttonColor = getComputedStyle(document.documentElement).getPropertyValue('--button-color').trim() || '#2481cc';

      if (charts.week) charts.week.destroy();

      charts.week = new Chart(ctx, {
        type: 'bar',
        data: {
          labels,
          datasets: [{
            data: values,
            backgroundColor: buttonColor + '99',
            borderColor: buttonColor,
            borderWidth: 1,
            borderRadius: 4
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            annotation: goal ? {
              annotations: {
                goalLine: {
                  type: 'line',
                  yMin: goal,
                  yMax: goal,
                  borderColor: '#ff6b6b',
                  borderWidth: 2,
                  borderDash: [5, 5]
                }
              }
            } : {}
          },
          scales: {
            y: { beginAtZero: true, grid: { display: false } },
            x: { grid: { display: false } }
          },
          onClick: (e, elements) => {
            if (elements.length > 0) {
              const index = elements[0].index;
              const date = dates[index];
              loadDayLog(date, 'week');
            }
          }
        }
      });
    }

    // Initialize month line chart
    function createMonthChart(data, metric) {
      const ctx = document.getElementById('month-chart').getContext('2d');
      const series = metricSeries(data, metric);
      const dates = Object.keys(data.daily).sort();
      const values = dates.map(d => series[d] || 0);

      const buttonColor = getComputedStyle(document.documentElement).getPropertyValue('--button-color').trim() || '#2481cc';

      if (charts.month) charts.month.destroy();

      charts.month = new Chart(ctx, {
        type: 'line',
        data: {
          labels: dates.map(d => d.slice(-2)), // Just day number
          datasets: [{
            data: values,
            borderColor: buttonColor,
            backgroundColor: buttonColor + '33',
            fill: true,
            tension: 0.3,
            pointRadius: 0
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            y: { beginAtZero: true, grid: { display: false } },
            x: {
              grid: { display: false },
              ticks: { maxTicksLimit: 7 }
            }
          }
        }
      });
    }

    // Create calendar for month view
    function createCalendar(data, metric) {
      const container = document.getElementById('calendar');
      const series = metricSeries(data, metric);
      const dates = Object.keys(data.daily).sort();
      const startDate = new Date(dates[0] + 'T00:00:00');
      const endDate = new Date(dates[dates.length - 1] + 'T00:00:00');

      // Get the first day of the month containing start date
      const firstOfMonth = new Date(startDate.getFullYear(), startDate.getMonth(), 1);
      const startDayOfWeek = firstOfMonth.getDay();

      const daysOfWeek = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];

      let html = `
        <div class="calendar-header">
          ${daysOfWeek.map(d => `<span>${d}</span>`).join('')}
        </div>
        <div class="calendar-grid">
      `;

      // Empty cells for days before start of month
      for (let i = 0; i < startDayOfWeek; i++) {
        html += `<button class="calendar-day empty"></button>`;
      }

      // Generate days
      const daysInMonth = new Date(startDate.getFullYear(), startDate.getMonth() + 1, 0).getDate();
      const dataSet = new Set(dates);

      for (let day = 1; day <= daysInMonth; day++) {
        const dateStr = `${startDate.getFullYear()}-${String(startDate.getMonth() + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const hasData = dataSet.has(dateStr) && series[dateStr] > 0;
        const isSelected = dateStr === selectedDate;

        const classes = ['calendar-day'];
        if (hasData) classes.push('has-data');
        else classes.push('no-data');
        if (isSelected) classes.push('selected');

        html += `<button class="${classes.join(' ')}" data-date="${dateStr}">${day}</button>`;
      }

      html += '</div>';
      container.innerHTML = html;

      // Add click handlers
      container.querySelectorAll('.calendar-day[data-date]').forEach(btn => {
        btn.addEventListener('click', () => {
          const date = btn.dataset.date;
          selectCalendarDay(date, data);
        });
      });
    }

    function selectCalendarDay(date, data) {
      selectedDate = date;

      // Update calendar selection
      document.querySelectorAll('.calendar-day').forEach(btn => {
        btn.classList.toggle('selected', btn.dataset.date === date);
      });

      loadDayLog(date, 'month');
    }

    async function loadDayLog(date, target) {
      const container = document.getElementById(`${target}-log`);
      container.innerHTML = '<div class="loading">Loading...</div>';
      track('miniapp_day_opened', { view: target });

      try {
        const data = await api(`/api/day/${date}`);
        renderFoodLog(container, data.items, date);
      } catch (e) {
        container.innerHTML = '<div class="empty-state">Failed to load</div>';
      }
    }

    // Views and tabs. The food edit form is a view with no tab of its own.
    function showView(name) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.getElementById(`${name}-view`).classList.add('active');
    }

    function showTab(target) {
      document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === target));
      showView(target);
      if (target !== 'foods') {
        editingFood = null;
        tg.BackButton.hide();
      }
      loadTabData(target);
    }

    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        showTab(tab.dataset.tab);
        track('miniapp_tab_changed', { tab: tab.dataset.tab });
      });
    });

    // Calories plus each tracked macro, hidden when there is nothing to switch
    // to. One shared metric: switching on Week also switches Month, so the two
    // views never disagree.
    function renderMetricToggles() {
      const keys = ['calories', ...trackedMacros()];
      if (!keys.includes(metric)) metric = 'calories';
      document.querySelectorAll('.segmented').forEach(group => {
        group.innerHTML = '';
        group.classList.toggle('hidden', keys.length < 2);
        for (const key of keys) {
          const btn = document.createElement('button');
          btn.dataset.metric = key;
          btn.textContent = key === 'calories' ? 'Calories' : MACRO_LABELS[key].toggle;
          btn.classList.toggle('active', key === metric);
          btn.addEventListener('click', () => selectMetric(key));
          group.appendChild(btn);
        }
      });
    }

    function selectMetric(key) {
      if (key !== metric) track('miniapp_metric_changed', { metric: key });
      metric = key;
      document.querySelectorAll('.segmented button').forEach(b => {
        b.classList.toggle('active', b.dataset.metric === metric);
      });
      if (weekData && userData) createWeekChart(weekData, userData, metric);
      if (monthData) {
        createMonthChart(monthData, metric);
        createCalendar(monthData, metric);
      }
    }

    // Food library (Foods tab). Names are the user's own text: always
    // textContent, never innerHTML.
    let foods = null;
    let selecting = false;
    const selectedFoods = new Set();
    let editingFood = null;

    async function apiSend(method, endpoint, body) {
      let res = null;
      try {
        res = await fetch(endpoint, {
          method,
          headers: { 'Authorization': `tg-init-data ${tg.initData}`, 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
      } catch (e) {
        return { ok: false, status: 0, data: null };
      }
      let data = null;
      try { data = await res.json(); } catch (e) { data = null; }
      return { ok: res.ok, status: res.status, data };
    }

    // Telegram's own dialogs where the client supports them (Bot API 6.2+), the browser's otherwise.
    function confirmAction(message) {
      return new Promise(resolve => {
        try {
          tg.showConfirm(message, ok => resolve(Boolean(ok)));
        } catch (e) {
          resolve(window.confirm(message));
        }
      });
    }

    function notify(message) {
      try { tg.showAlert(message); } catch (e) { window.alert(message); }
    }

    function plural(n) {
      return n === 1 ? 'food' : 'foods';
    }

    async function loadFoods() {
      let data = null;
      try {
        data = await api('/api/foods');
      } catch (e) {
        document.getElementById('foods-list').innerHTML = '<div class="empty-state">Could not load your foods. Try again.</div>';
        return;
      }
      foods = data.foods;
      renderFoods();
    }

    function renderFoods() {
      const list = document.getElementById('foods-list');
      const query = document.getElementById('foods-search').value.trim().toLowerCase();
      const all = foods || [];
      const selectBtn = document.getElementById('foods-select');
      document.getElementById('foods-count').textContent = all.length ? `${all.length} saved` : '';
      selectBtn.classList.toggle('hidden', all.length === 0);
      selectBtn.textContent = selecting ? 'Done' : 'Select';
      list.innerHTML = '';

      if (all.length === 0) {
        list.innerHTML = '<div class="empty-state">No saved foods yet. Use /foods in the chat to add some.</div>';
        renderDeleteBar();
        return;
      }

      const shown = all.filter(food => !query || food.name.toLowerCase().includes(query));
      if (shown.length === 0) {
        list.innerHTML = '<div class="empty-state">No foods match.</div>';
      }

      for (const food of shown) {
        const row = document.createElement('div');
        row.className = 'food-item food-row';

        if (selecting) {
          const box = document.createElement('input');
          box.type = 'checkbox';
          box.className = 'food-check';
          box.checked = selectedFoods.has(food.id);
          box.tabIndex = -1;
          row.appendChild(box);
        }

        const details = document.createElement('div');
        details.className = 'food-details';
        const name = document.createElement('div');
        name.className = 'food-name';
        name.textContent = food.name;
        const serving = document.createElement('div');
        serving.className = 'food-macros';
        serving.textContent = food.serving;
        details.appendChild(name);
        details.appendChild(serving);

        const calories = document.createElement('div');
        calories.className = 'food-calories';
        calories.textContent = `${food.calories} cal`;

        row.appendChild(details);
        row.appendChild(calories);
        row.addEventListener('click', () => {
          if (selecting) toggleFoodSelection(food.id);
          else openFoodForm(food);
        });
        list.appendChild(row);
      }
      renderDeleteBar();
    }

    function toggleFoodSelection(id) {
      if (selectedFoods.has(id)) selectedFoods.delete(id);
      else selectedFoods.add(id);
      renderFoods();
    }

    function renderDeleteBar() {
      document.getElementById('foods-delete-bar').classList.toggle('hidden', !selecting);
      const btn = document.getElementById('foods-delete');
      btn.textContent = `Delete ${selectedFoods.size}`;
      btn.disabled = selectedFoods.size === 0;
    }

    document.getElementById('foods-search').addEventListener('input', renderFoods);

    document.getElementById('foods-select').addEventListener('click', () => {
      selecting = !selecting;
      selectedFoods.clear();
      renderFoods();
    });

    document.getElementById('foods-delete').addEventListener('click', async () => {
      const ids = Array.from(selectedFoods);
      if (ids.length === 0) return;
      const ok = await confirmAction(`Delete ${ids.length} ${plural(ids.length)}?`);
      if (!ok) return;
      const res = await apiSend('DELETE', '/api/foods', { ids });
      if (!res.ok) {
        notify('Could not delete. Try again.');
        return;
      }
      track('miniapp_foods_deleted', { count: ids.length });
      selecting = false;
      selectedFoods.clear();
      await loadFoods();
    });

    function valueOrBlank(value) {
      return value === null || value === undefined ? '' : value;
    }

    function numberOrNull(value) {
      const text = String(value).trim();
      return text === '' ? null : Number(text);
    }

    function showFormError(message) {
      const box = document.getElementById('food-form-error');
      box.textContent = message ? message.charAt(0).toUpperCase() + message.slice(1) : '';
      box.classList.toggle('hidden', !message);
    }

    function openFoodForm(food) {
      editingFood = food;
      const form = document.getElementById('food-form');
      form.elements.name.value = food.name;
      form.elements.serving.value = food.serving;
      form.elements.serving_amount.value = valueOrBlank(food.serving_amount);
      form.elements.serving_unit.value = food.serving_unit || '';
      form.elements.calories.value = food.calories;

      const macros = document.getElementById('food-form-macros');
      macros.innerHTML = '';
      for (const key of Object.keys(MACRO_LABELS)) {
        const label = document.createElement('label');
        label.textContent = `${MACRO_LABELS[key].form} (g)`;
        const input = document.createElement('input');
        input.name = MACRO_LABELS[key].column;
        input.type = 'number';
        input.min = '0';
        input.max = '500';
        input.step = 'any';
        input.inputMode = 'decimal';
        input.placeholder = 'not on label';
        input.value = valueOrBlank(food[MACRO_LABELS[key].column]);
        label.appendChild(input);
        macros.appendChild(label);
      }

      showFormError('');
      showView('food-edit');
      tg.BackButton.show();
    }

    function closeFoodForm() {
      editingFood = null;
      tg.BackButton.hide();
      showView('foods');
    }

    tg.BackButton.onClick(closeFoodForm);

    document.getElementById('food-form').addEventListener('submit', async event => {
      event.preventDefault();
      if (!editingFood) return;
      const form = event.target;
      const body = {
        name: form.elements.name.value,
        serving: form.elements.serving.value,
        serving_amount: numberOrNull(form.elements.serving_amount.value),
        serving_unit: form.elements.serving_unit.value || null,
        calories: numberOrNull(form.elements.calories.value)
      };
      for (const key of Object.keys(MACRO_LABELS)) {
        const column = MACRO_LABELS[key].column;
        body[column] = numberOrNull(form.elements[column].value);
      }
      const res = await apiSend('PATCH', `/api/foods/${editingFood.id}`, body);
      if (!res.ok) {
        showFormError((res.data && res.data.error) || 'Could not save. Try again.');
        return;
      }
      track('miniapp_food_edited');
      await loadFoods();
      closeFoodForm();
    });

    document.getElementById('food-form-delete').addEventListener('click', async () => {
      if (!editingFood) return;
      const ok = await confirmAction(`Delete ${editingFood.name}?`);
      if (!ok) return;
      const res = await apiSend('DELETE', '/api/foods', { ids: [editingFood.id] });
      if (!res.ok) {
        showFormError('Could not delete. Try again.');
        return;
      }
      track('miniapp_foods_deleted', { count: 1 });
      await loadFoods();
      closeFoodForm();
    });

    async function loadTabData(tab) {
      try {
        if (tab === 'today') {
          const [user, today] = await Promise.all([
            userData ? Promise.resolve(userData) : loadUser(),
            api('/api/today')
          ]);
          userData = user;

          createProgressChart(today.total, user.daily_goal || 2000);
          renderMacros(today, user);
          renderFoodLog(document.getElementById('today-log'), today.items);
        }

        if (tab === 'week') {
          if (!weekData) weekData = await api('/api/stats?period=week');
          if (!userData) userData = await loadUser();

          renderMetricToggles();
          createWeekChart(weekData, userData, metric);
          document.getElementById('week-log').innerHTML = `
            <div class="empty-state">
              <div class="empty-state-icon">👆</div>
              <div>Tap a bar to see that day's log</div>
            </div>
          `;
        }

        if (tab === 'month') {
          if (!monthData) monthData = await api('/api/stats?period=month');
          if (!userData) userData = await loadUser();
          renderMetricToggles();

          createMonthChart(monthData, metric);
          createCalendar(monthData, metric);
          document.getElementById('month-log').innerHTML = `
            <div class="empty-state">
              <div class="empty-state-icon">📅</div>
              <div>Tap a day to see its log</div>
            </div>
          `;
        }

        if (tab === 'foods') {
          await loadFoods();
        }
      } catch (e) {
        console.error('Failed to load data:', e);
      }
    }

    // Initial load. Today shows right away, loading its user and its data
    // together, unless ?tab=foods (the bot's "Open my foods" button) asked
    // for the Foods tab, which waits on the user to know whether it's on.
    async function init() {
      const wanted = new URLSearchParams(window.location.search).get('tab');
      if (wanted !== 'foods') showTab('today');
      let user = null;
      try {
        user = await loadUser();
        userData = user;
      } catch (e) {
        console.error('Failed to load user:', e);
      }
      const libraryOn = Boolean(user && user.food_library);
      document.getElementById('foods-tab').classList.toggle('hidden', !libraryOn);
      if (wanted === 'foods') showTab(libraryOn ? 'foods' : 'today');
    }

    init();
  </script>
</body>
</html>
